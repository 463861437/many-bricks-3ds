name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run game, paddle, save, input, render, audio and main-loop tests
        env:
          CXX: clang++
          HOST_CXX: clang++
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ./check.sh
      - name: Check Python script syntax
        run: python3 -m compileall -q packaging tests
